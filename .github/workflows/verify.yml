name: Verify release
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check JavaScript syntax
        run: find api -name '*.js' -exec node --check '{}' \; && node --check portal.js && node --check landing.js
      - name: Run release tests when present
        run: if [ -f tests/release.cjs ]; then node tests/release.cjs; fi
      - name: Package reviewable source
        run: git archive HEAD -o release-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-source
          path: release-source.tar
          retention-days: 7
