name: Verify release
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and verify source contracts
        run: node tests/release.cjs
      - name: Install pinned browser test tooling
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python tests/browser.py
      - name: Verify deployed production after main changes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python tests/deployed.py
          TEST_BASE_URL=https://axalidavaleba4.vercel.app python tests/browser.py
      - name: Package reviewable source
        if: always()
        run: git archive HEAD -o release-source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-review
          path: |
            release-source.tar
            test-results/
          retention-days: 7
